<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StudyBuddy | Developer Learning Ecosystem & Coding Practice Tracker</title>
    <meta
      name="description"
      content="StudyBuddy is the all-in-one developer learning ecosystem: 15,600+ curated DSA problems (Striver SDE 180, Striver A2Z, NeetCode 150, Codeforces Ladders), distraction-free YouTube course hub with timestamped notes, and in-browser Stufu code studio."
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Disable Mobile Auto-Phone Linking on Numbers/Codes -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-paint Theme & Skin Init (Prevents FOUC) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("studybuddy_theme") === "light" ? "light" : "dark";
          var skin = localStorage.getItem("studybuddy_skin") === "basic" ? "basic" : "web";
          var root = document.documentElement;
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-skin", skin);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
